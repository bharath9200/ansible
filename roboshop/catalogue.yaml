---
- name: configure the catalogue service
  hosts: catalogue
  become: yes
  vars:
    userid: roboshop
  tasks:
    - name: disable the default package
      ansible.builtin.command:
        cmd: dnf module disable nodejs -y 

    - name: enable the default package with version 24
      ansible.builtin.command:
        cmd: dnf module enable nodejs:24 -y

    - name: install the nodejs 24 package
      ansible.builtin.dnf:
        name: nodejs
        state: present
    - name: create a system user
      ansible.builtin.user:
        name: "{{ userid }}"
        state: present
        shell: /usr/sbin/nologin
        create_home: /app
        system: yes
    - name: delete a folder /app it is used when you execute multiple time
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create a folder /app
      ansible.builtin.file:
        path: /app
        state: directory
        owner: "{{ userid }}"
        group: "{{ userid }}"
    - name: delete catalogue.zip it is used when you execute multiple time
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent
    - name: get the source code from the git
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip
        mode: '0644'
    - name: unzip the contents
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        owner: "{{ userid }}"
        group: "{{ userid }}"
        remote_src: yes
    - name: build the code
      ansible.builtin.command:
        cmd: npm install
        chdir: /app
    - name: copy the service file to remote
      ansible.builtin.replace:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service
    - name: update the systemd service
      ansible.builtin.replace:
        path: /etc/systemd/system/catalogue.service
        regexp: <MONGODB-SERVER-IPADDRESS>
        replace: "{{ mongodb_address }}"
    - name: restart, start and enable the service
      ansible.builtin.service:
        name: catalogue
        state: started
        enabled: yes
        daemon_reload: yes
    - name: copy the mongodb repo for mongo client
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
    - name: install mongodb client
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present
    - name: check the products count
      ansible.builtin.command:
        cmd: mongosh --host {{ mongodb_server }} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count
    - name: print the no of products available
      ansible.builtin.debug:
        msg: "{{ product_count }}"

    - name: load the data into the table, it should run only once
      ansible.builtin.command:
        cmd: mongosh --host "{{ mongodb_server }}" </app/db/master-data.js
      when: product_count.stdout | int == 0
    - name: restart the service with daemon-reload
      ansible.builtin.service:
        name: catalogue
        daemon_reload: yes
        state: restarted
        enabled: yes

    

