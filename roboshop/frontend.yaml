---
- name: frontend component configuration
  hosts: frontend
  become: yes
  tasks:
    # - name: Gather service facts
    #   ansible.builtin.service_facts:

    # - name: Stop running frontend service
    #   ansible.builtin.service:
    #     name: nginx
    #     state: stopped
    #   when:
    #     - "'nginx.service' in ansible_facts.services"
    #     - ansible_facts.services['nginx.service'].state == 'running'

    - name: disable the default package
      ansible.builtin.command:
        cmd: dnf module disable nginx -y

    - name: enable the default package with version 1.26
      ansible.builtin.command:
        cmd: dnf module enable nginx:1.26 -y

    - name: install the nginx package
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: get the source code from the git
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
        dest: /tmp/frontend.zip
        mode: '0644'
    - name: unzip the contents
      ansible.builtin.unarchive:
        src: /tmp/frontend.zip
        dest: /usr/share/nginx/html/
        remote_src: yes

    - name: copy the configuration file
      ansible.builtin.template:
        src: roboshop.conf
        dest: /etc/nginx/default.d/roboshop.conf
        mode: "0644"

    - name: daemon reload and restart the nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
        daemon_reload: yes