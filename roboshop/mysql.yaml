---
- name: mysql component configuration
  hosts: mysql
  become: yes
  vars: 
    userid: roboshop
  tasks:
    - name: Stop running mysql service
      ansible.builtin.systemd:
        name: mysqld
        state: stopped
      when: ansible_facts.services['mysqld.service'].state == 'running'

    - name: enable the default package
      ansible.builtin.command:
        cmd: dnf module enable mysql:8.4 -y

    - name: install the mysql-server package
      ansible.builtin.dnf:
        name: mysql-server
        state: present
    - name: daemon reload, start and enable the mysqld service
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes
        daemon_reload: yes
    - name: set the root password to mysql mysql-server
      ansible.builtin.shell:
        cmd: "mysql_secure_installation --set-root-pass RoboShop@1"