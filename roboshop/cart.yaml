---
- name: cart component configuration
  hosts: cart
  become: yes
  vars: 
    userid: roboshop
  tasks:
    # - name: gather system service fact details
    #   ansible.builtin.service_facts:
    
    # - name: Stop running cart service
    #   ansible.builtin.service:
    #     name: cart
    #     state: stopped
    #   when:
    #     - "'cart.service' in ansible_facts.services"
    #     - ansible_facts.services['cart.service'].state == 'running'
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Stop running user service
      ansible.builtin.service:
        name: cart
        state: stopped
      when:
        - "'cart.service' in ansible_facts.services"
        - ansible_facts.services['cart.service'].state == 'running'
    
    - name: disable the default package
      ansible.builtin.command:
        cmd: dnf module disable nodejs -y 

    - name: enable the default package with version 24
      ansible.builtin.command:
        cmd: dnf module enable nodejs:24 -y

    - name: install the nodejs 24 package
      ansible.builtin.dnf:
        name: nodejs
        state: present
    - name: create a system user
      ansible.builtin.user:
        name: "{{ userid }}"
        state: present
        shell: /usr/sbin/nologin
        create_home: yes
        system: yes
        home: /app
    - name: delete a folder /app it is used when you execute multiple time
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create a folder /app
      ansible.builtin.file:
        path: /app
        state: directory
        owner: "{{ userid }}"
        group: "{{ userid }}"
    - name: delete catalogue.zip it is used when you execute multiple time
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent
    - name: get the source code from the git
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
        dest: /tmp/cart.zip
        mode: '0644'
    - name: unzip the contents
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        owner: "{{ userid }}"
        group: "{{ userid }}"
        remote_src: yes
    - name: build the code
      ansible.builtin.command:
        cmd: npm install
        chdir: /app
    - name: copy the service to remote location
      ansible.builtin.copy:
        src: cart.service
        dest: /etc/systemd/system/cart.service
    - name: replace redis and catalog service in the cart.service
      ansible.builtin.replace:
        path: /etc/systemd/system/user.service
        regexp: "<REDIS-SERVER-IPADDRESS>"
        replace: "{{ redis_address }}"
    - name: replace redis and catalog service in the cart.service
      ansible.builtin.replace:
        path: /etc/systemd/system/user.service
        regexp: "<CATALOGUE-SERVER-IPADDRESS>"
        replace: "{{ catalogue_address }}"
    - name: daemon reload, start and enable the user service
      ansible.builtin.service:
        name: cart
        state: started
        enabled: yes
        daemon_reload: yes