---
- name: create an ec2 instance in aws
  hosts: local
  connection: local
 # become: true
  vars:
    instance_name: mongodb
    instance_type: t3.micro
    image_id: ami-0055977a6e828a4f4
    security_group: "roboshop-{{ instance_name }}"
  tasks:
    - name: create an ec2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}-roboshop"
        instance_type: "{{ instance_type }}"
        image_id: "{{ image_id }}"
        security_group: "{{ security_group }}"
        region: us-east-1
        wait: true
      register: ec2
    - name: display the instance public and private ip address
      ansible.builtin.debug:
        msg:
          - "public ip address: {{ ec2.instances[0].public_ip_address }}"
          - "private ip address: {{ ec2.instances[0].private_ip_address }}"
